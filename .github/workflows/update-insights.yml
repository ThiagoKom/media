name: Atualizar insights do Instagram
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-insights.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Commit se mudou
        run: |
          git config user.name "insights-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Atualiza insights" && git push)
